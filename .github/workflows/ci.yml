name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: SwiftPM tests
        run: swift test

      - name: Xcode app build
        run: |
          xcodebuild \
            -project KanbanBoard.xcodeproj \
            -scheme KanbanBoardApp \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            build

      - name: Xcode tests
        run: |
          xcodebuild \
            -project KanbanBoard.xcodeproj \
            -scheme KanbanBoardApp \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            test
